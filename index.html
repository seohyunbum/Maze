<style>
  /* 미로 자체(흰 종이 + 검은 벽 + 검은 선)는 규칙이므로 테마와 무관하게 고정한다.
     테마를 타는 것은 미로를 둘러싼 UI뿐이다. */
  :root{
    --shell:#e7ebf0; --panel:#ffffff; --raise:#f2f5f8;
    --rule:#c5cedb; --text:#12151a; --muted:#6b7684;
    --ink:#12151a; --onInk:#ffffff;
    --start:#0b7a52; --goal:#c62b40;
    --veil:rgba(231,235,240,.88); --shadow:0 8px 26px rgba(18,21,26,.14);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --shell:#13171d; --panel:#1b212a; --raise:#232b36;
      --rule:#2f3945; --text:#dce3ec; --muted:#8b97a7;
      --ink:#dce3ec; --onInk:#12151a;
      --start:#3fbf8c; --goal:#ff7183;
      --veil:rgba(19,23,29,.88); --shadow:0 8px 30px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --shell:#13171d; --panel:#1b212a; --raise:#232b36;
    --rule:#2f3945; --text:#dce3ec; --muted:#8b97a7;
    --ink:#dce3ec; --onInk:#12151a;
    --start:#3fbf8c; --goal:#ff7183;
    --veil:rgba(19,23,29,.88); --shadow:0 8px 30px rgba(0,0,0,.5);
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; height:100%; overflow:hidden;
    background:var(--shell); color:var(--text);
    /* 당겨서 새로고침·고무줄 스크롤을 끈다 — 미로를 긋다가 화면이 튀면 안 된다 */

  button.primary{background:var(--ink); color:var(--onInk); border-color:var(--ink)}
  button:active{transform:translateY(1px)}
  button:focus-visible,select:focus-visible{outline:2px solid var(--ink); outline-offset:2px}

    border:1px solid var(--rule)}
  .legend .s{background:#0b7a52} .legend .g{background:#c62b40} .legend .w{background:#000}

  /* 미로는 책상 위에 놓인 종이 한 장처럼 */
  #stage{flex:1; min-height:0; position:relative; display:flex; align-items:center; justify-content:center;

const SEO_IDENT_DURATION_MS = 4430;

function shouldPlaySeoIdent(search, automated) {

}

function mountSeoStudioIdent(doc = document) {
  if (doc.getElementById("seo-studio-ident")) return null;
  const freezeRaw = new URLSearchParams(location.search).get("seoIdentT");
  const freezeSeconds = freezeRaw === null ? Number.NaN : Number(freezeRaw);
  const frozenForQa = Number.isFinite(freezeSeconds) && freezeSeconds >= 0;
  const style = doc.createElement("style");
  style.id = "seo-studio-ident-style";
  style.textContent = `
    #seo-studio-ident{position:fixed;inset:0;z-index:2147483647;background:#000;color:#f8f8f6;

    @keyframes seo-orbit-draw{0%,19.86%{stroke-dashoffset:628}38.83%,100%{stroke-dashoffset:3}}
    @keyframes seo-orbit-fade{0%,19.86%{opacity:0}30%{opacity:.75}39.28%{opacity:.55}49.66%,100%{opacity:0}}
    @keyframes seo-sweep{0%,46.27%{opacity:0;transform:translateX(-135%)}49%{opacity:1}
      58.69%{opacity:0;transform:translateX(135%)}100%{opacity:0}}
    @keyframes seo-hint{0%,24.83%{opacity:0}35%{opacity:.42}73.36%{opacity:.42}83.52%,100%{opacity:0}}

    .seo-ident--frozen .seo-ident__trace,.seo-ident--frozen .seo-ident__mark,.seo-ident--frozen .seo-ident__letter,

  if (frozenForQa) {
    overlay.classList.add("seo-ident--frozen");
    overlay.style.setProperty("--seo-ident-delay", `${-freezeSeconds}s`);

  overlay.setAttribute("role", "img");

  doc.head.appendChild(style);
  doc.body.prepend(overlay);
  let timer = 0;
  const finish = (event) => {
    event?.preventDefault();
    event?.stopImmediatePropagation();
    clearTimeout(timer);
    window.removeEventListener("keydown", finish, true);
    overlay.removeEventListener("pointerdown", finish, true);
    overlay.removeEventListener("touchstart", finish, true);
    overlay.remove();
    style.remove();
  };
  window.addEventListener("keydown", finish, true);
  overlay.addEventListener("pointerdown", finish, true);
  overlay.addEventListener("touchstart", finish, { capture: true, passive: false });
  if (!frozenForQa) timer = window.setTimeout(finish, SEO_IDENT_DURATION_MS);
  return () => finish();
}

if (shouldPlaySeoIdent(location.search, navigator.webdriver)) mountSeoStudioIdent();

<script>
(() => {
'use strict';

/* ────────────────────────────────────────────────────────────
   규칙 (모든 미로 공통)
   1) 손(손가락/마우스)이 지나간 자리는 검은색으로 그려진다.
   2) 검은색 벽은 절대 넘어갈 수 없다.
   미로는 (2*n+1) 크기의 격자로 표현한다. 1 = 검은 벽, 0 = 흰 통로.
   좌표 단위(unit)는 "격자 칸 1개 = 1"이며, 화면 픽셀과 분리해서
   창 크기가 바뀌어도 그려둔 선과 펜 위치가 그대로 유지된다.
   ──────────────────────────────────────────────────────────── */

const PEN_R  = 0.26;  // 펜 굵기(충돌 판정 반지름). 통로 반폭 0.5보다 작아야 한다.
const STEP   = 0.07;  // 이동을 잘게 쪼개는 간격 — 벽을 뛰어넘지 못하게 하는 핵심
const GRAB_R = 1.6;   // 펜을 다시 집을 수 있는 거리
const TRAIL_W = 0.34; // 그려지는 검은 선의 두께(unit)

const cv  = document.getElementById('cv');
const ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);

let maze = null;      // {g,W,H,cols,rows}
let mazeCanvas = null;// 벽을 미리 그려둔 오프스크린 캔버스
let S = 10;           // 격자 1칸의 픽셀 크기
let trail = [];       // [{x,y}] 손이 지나간 자리 (unit 좌표)
let pen = {x:0, y:0}; // 현재 펜 끝
let dragging = false;
let solved = false;
let hits = 0;         // 벽에 막힌 횟수
let t0 = 0, elapsed = 0, running = false;
let hintPath = null;  // 정답 경로 (unit 좌표 배열)
let seedCols = 16;
let grabOff = {x:0, y:0}; // 잡은 순간의 손가락↔펜 간격 (펜이 손가락으로 튀지 않게)
let touchMode = false;    // 손가락 입력이면 펜 표시를 크게 (손에 가려지므로)

/* ── 미로 생성 : recursive backtracker (항상 풀 수 있는 미로) ── */
function genMaze(cols, rows){
  const W = cols*2+1, H = rows*2+1;
  const g = Array.from({length:H}, () => new Uint8Array(W).fill(1));
  const seen = Array.from({length:rows}, () => new Uint8Array(cols));
  const dirs = [[0,-1],[1,0],[0,1],[-1,0]];

  const stack = [[0,0]];
  seen[0][0] = 1; g[1][1] = 0;

  while(stack.length){
    const [cx,cy] = stack[stack.length-1];
    const opts = [];
    for(const [dx,dy] of dirs){
      const nx = cx+dx, ny = cy+dy;
      if(nx>=0 && nx<cols && ny>=0 && ny<rows && !seen[ny][nx]) opts.push([nx,ny,dx,dy]);
    }
    if(!opts.length){ stack.pop(); continue; }
    const [nx,ny,dx,dy] = opts[(Math.random()*opts.length)|0];
    seen[ny][nx] = 1;
    g[cy*2+1+dy][cx*2+1+dx] = 0;  // 두 칸 사이의 벽을 허문다
    g[ny*2+1][nx*2+1] = 0;
    stack.push([nx,ny]);
  }

  g[1][0] = 0;                 // 왼쪽 위: START 입구
  g[rows*2-1][cols*2] = 0;     // 오른쪽 아래: GOAL 출구
  return {g, W, H, cols, rows};
}

const startCell = () => ({x:0.5, y:1.5});
const goalCell  = () => ({x:maze.cols*2+0.5, y:maze.rows*2-0.5});

/* ── 정답 경로: 흰 통로 위에서 BFS. 격자 인덱스 배열을 돌려준다 ── */
const DIRS4 = [[1,0],[-1,0],[0,1],[0,-1]];
function solveIdx(m){
  const {g,W,H} = m;
  const sx=0, sy=1, gx=m.cols*2, gy=m.rows*2-1;
  const prev = new Int32Array(W*H).fill(-1);
  const q = [sy*W+sx];
  prev[sy*W+sx] = sy*W+sx;
  for(let h=0; h<q.length; h++){
    const cur = q[h];
    if(cur === gy*W+gx) break;
    const cx = cur%W, cy = (cur/W)|0;
    for(const [dx,dy] of DIRS4){
      const nx=cx+dx, ny=cy+dy;
      if(nx<0||ny<0||nx>=W||ny>=H) continue;
      if(g[ny][nx]) continue;
      const ni = ny*W+nx;
      if(prev[ni] !== -1) continue;
      prev[ni] = cur; q.push(ni);
    }
  }
  const goal = gy*W+gx;
  if(prev[goal] === -1) return null;
  const out = [];
  for(let cur = goal; ; cur = prev[cur]){
    out.push(cur);
    if(prev[cur] === cur) break;
  }
  return out.reverse();
}

/* 화면에 그릴 정답 경로 (unit 좌표) */
function solve(m = maze){
  const idx = solveIdx(m);
  if(!idx) return null;
  return idx.map(i => ({x: i % m.W + 0.5, y: ((i / m.W)|0) + 0.5}));
}

/* ── 난이도 측정 ──
   크기가 같아도 정답이 짧고 갈림길이 없으면 순식간에 풀린다. 실제로 재던 값은
   22×22 에서 갈림길이 3개뿐인 미로까지 나왔다. 그래서 후보를 여러 개 만들어
   가장 어려운 것만 내보낸다.
   - len   : 정답 경로 길이 — 짧으면 그냥 가깝다
   - junc  : 정답 경로에서 옆으로 새는 갈림길 수 — 헷갈릴 기회
   - decoy : 그 갈림길이 얼마나 깊게 이어지는지 — 잘못 들었을 때의 손해
             (한 곳이 지나치게 깊어도 점수를 독식하지 않도록 14에서 자른다) */
function rateMaze(m){
  const idx = solveIdx(m);
  if(!idx) return null;
  const {g,W,H} = m;
  const onPath = new Uint8Array(W*H);
  for(const i of idx) onPath[i] = 1;

  let junc = 0, decoy = 0;
  const seen = new Uint8Array(W*H);
  for(const cur of idx){
    const cx = cur%W, cy = (cur/W)|0;
    for(const [dx,dy] of DIRS4){
      const nx=cx+dx, ny=cy+dy;
      if(nx<0||ny<0||nx>=W||ny>=H || g[ny][nx]) continue;
      const ni = ny*W+nx;
      if(onPath[ni]) continue;
      junc++;
      // 곁가지의 최대 깊이 = 정답 경로를 밟지 않는 BFS. 가지끼리 겹치지 않아
      // 전체 비용은 칸 수에 비례한다.
      seen[ni] = 1;
      const q = [ni], dep = [1];
      let mx = 0;
      for(let h=0; h<q.length; h++){
        if(dep[h] > mx) mx = dep[h];
        const ax = q[h]%W, ay = (q[h]/W)|0;
        for(const [ex,ey] of DIRS4){
          const bx=ax+ex, by=ay+ey;
          if(bx<0||by<0||bx>=W||by>=H || g[by][bx]) continue;
          const bi = by*W+bx;
          if(onPath[bi] || seen[bi]) continue;
          seen[bi] = 1; q.push(bi); dep.push(dep[h]+1);
        }
      }
      decoy += Math.min(mx, 14);
    }
  }
  return {len: idx.length, junc, decoy, score: idx.length + 6*junc + 2*decoy};
}

/* 후보를 여러 개 만들어 가장 어려운 미로를 고른다.
   정답이 지나치게 짧은 미로는 아예 후보에서 뺀다(쉬운 뽑기 제거). */
function genBestMaze(cols, rows){
  const floor = 3*(cols + rows);
  const t0 = performance.now();
  let best = null, longEnough = null;
  for(let i=0; i<40; i++){
    const m = genMaze(cols, rows);
    const r = rateMaze(m);
    if(!r) continue;
    m.rating = r;
    if(!best || r.score > best.rating.score) best = m;
    if(r.len >= floor && (!longEnough || r.score > longEnough.rating.score)) longEnough = m;
    if(i >= 8 && performance.now() - t0 > 250) break;  // 느린 기기 보호
  }
  return longEnough || best;
}

/* ── 벽 판정: 검은 칸이면 통과 불가 ── */
function solid(ux, uy){
  const gx = Math.floor(ux), gy = Math.floor(uy);
  if(gx<0 || gy<0 || gx>=maze.W || gy>=maze.H) return true; // 미로 밖도 벽 취급
  return maze.g[gy][gx] === 1;
}
// 펜은 점이 아니라 굵기가 있으므로 둘레를 함께 검사한다 → 벽에 파고들지 않는다
function free(ux, uy){
  const r = PEN_R, d = r*0.71;
  return !solid(ux, uy) &&
         !solid(ux-r, uy) && !solid(ux+r, uy) && !solid(ux, uy-r) && !solid(ux, uy+r) &&
         !solid(ux-d, uy-d) && !solid(ux+d, uy-d) && !solid(ux-d, uy+d) && !solid(ux+d, uy+d);
}

function pushTrail(x, y){
  pen.x = x; pen.y = y;
  const last = trail[trail.length-1];
  if(!last || Math.hypot(last.x-x, last.y-y) > 0.02) trail.push({x, y});
}

/* ── 이동: 아주 잘게 나눠 한 칸씩 전진. 막히면 미끄러지듯 벽을 따라간다 ── */
function moveTo(tx, ty){
  const dist = Math.hypot(tx-pen.x, ty-pen.y);
  if(dist < 1e-6) return;
  const steps = Math.max(1, Math.ceil(dist / STEP));
  const sx = (tx-pen.x)/steps, sy = (ty-pen.y)/steps;
  let stuck = false;

  for(let i=0; i<steps; i++){
    const nx = pen.x+sx, ny = pen.y+sy;
    if(free(nx, ny))          pushTrail(nx, ny);
    else if(free(nx, pen.y))  pushTrail(nx, pen.y);   // 가로로만 미끄러짐 (모서리 돌기 — 정상)
    else if(free(pen.x, ny))  pushTrail(pen.x, ny);   // 세로로만 미끄러짐 (모서리 돌기 — 정상)
    else { stuck = true; break; }                     // 벽에 완전히 막힘
  }

  // 완전히 막혔을 때만 카운트한다. 너무 자주 알리지 않도록 0.6초 간격을 둔다.
  if(stuck){
    const now = performance.now();
    if(now - (moveTo._last || 0) > 600){
      moveTo._last = now;
      hits++; $('tHit').textContent = hits;
      toast('🚧 검은 벽은 지나갈 수 없어요!');
    }
  }
  checkGoal();
}

function checkGoal(){
  if(solved) return;
  const g = goalCell();
  if(Math.hypot(pen.x-g.x, pen.y-g.y) < 0.55) win();
}

/* ── 화면 그리기 ── */
function buildMazeCanvas(){
  mazeCanvas = document.createElement('canvas');
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  mazeCanvas.width  = Math.round(maze.W * S * dpr);
  mazeCanvas.height = Math.round(maze.H * S * dpr);
  const c = mazeCanvas.getContext('2d');
  c.scale(dpr, dpr);

  c.fillStyle = '#fff';
  c.fillRect(0, 0, maze.W*S, maze.H*S);

  // 시작/도착 칸 표시
  c.fillStyle = 'rgba(10,143,60,.20)';
  c.fillRect(0, S, S, S);
  c.fillStyle = 'rgba(216,31,42,.20)';
  c.fillRect((maze.cols*2)*S, (maze.rows*2-1)*S, S, S);

  // 검은 벽
  c.fillStyle = '#000';
  for(let y=0; y<maze.H; y++){
    for(let x=0; x<maze.W; x++){
      if(maze.g[y][x]) c.fillRect(x*S, y*S, S+0.6, S+0.6); // 0.6: 칸 사이 흰 실선 방지
    }
  }
}

function layout(){
  const {w: availW, h: availH} = stageBox();
  S = Math.max(4, Math.floor(Math.min(availW/maze.W, availH/maze.H)));

  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.style.width  = (maze.W*S) + 'px';
  cv.style.height = (maze.H*S) + 'px';
  cv.width  = Math.round(maze.W*S*dpr);
  cv.height = Math.round(maze.H*S*dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  buildMazeCanvas();
}

function draw(){
  ctx.clearRect(0, 0, maze.W*S, maze.H*S);
  ctx.drawImage(mazeCanvas, 0, 0, maze.W*S, maze.H*S);

  // 정답 힌트 (연한 회색 점선)
  if(hintPath){
    ctx.save();
    ctx.strokeStyle = 'rgba(0,0,0,.22)';
    ctx.lineWidth = TRAIL_W*S*0.8;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.setLineDash([S*0.5, S*0.5]);
    ctx.beginPath();
    hintPath.forEach((p,i) => i ? ctx.lineTo(p.x*S, p.y*S) : ctx.moveTo(p.x*S, p.y*S));
    ctx.stroke();
    ctx.restore();
  }

  // ★ 손이 지나간 자리 — 검은색
  if(trail.length){
    ctx.strokeStyle = '#000';
    ctx.lineWidth = TRAIL_W*S;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(trail[0].x*S, trail[0].y*S);
    for(let i=1; i<trail.length; i++) ctx.lineTo(trail[i].x*S, trail[i].y*S);
    ctx.stroke();
  }

  // 펜 끝
  ctx.fillStyle = solved ? '#0a8f3c' : '#000';
  ctx.beginPath();
  ctx.arc(pen.x*S, pen.y*S, TRAIL_W*S*0.72, 0, Math.PI*2);
  ctx.fill();
  // 끄는 동안 펜 둘레에 고리를 그린다. 손가락 입력이면 손끝보다 크게 그려서
  // 손에 가려져도 펜이 어디 있는지 보이게 한다.
  if(dragging){
    const r = touchMode ? Math.max(TRAIL_W*S*1.35, 26) : TRAIL_W*S*1.35;
    ctx.strokeStyle = 'rgba(0,0,0,.3)';
    ctx.lineWidth = Math.max(1.5, S*0.08);
    ctx.beginPath();
    ctx.arc(pen.x*S, pen.y*S, r, 0, Math.PI*2);
    ctx.stroke();
  }

  if(running){
    elapsed = (performance.now() - t0)/1000;
    $('tTime').textContent = elapsed.toFixed(1);
  }
  requestAnimationFrame(draw);
}

/* ── 입력 ── */
function toUnit(e){
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left)/r.width * maze.W,
           y: (e.clientY - r.top )/r.height * maze.H };
}

cv.addEventListener('pointerdown', e => {
  if(solved) return;
  const p = toUnit(e);
  if(Math.hypot(p.x-pen.x, p.y-pen.y) > GRAB_R){
    toast('✋ 펜(검은 점)에서 이어서 그려 주세요');
    return;
  }
  // 잡은 순간의 "손가락 → 펜" 거리를 유지한다. 펜이 손가락으로 순간이동하지 않고,
  // 휴대폰에서 펜 살짝 아래를 잡으면 손가락에 가려지지 않은 채로 끌 수 있다.
  grabOff.x = pen.x - p.x;
  grabOff.y = pen.y - p.y;
  touchMode = (e.pointerType === 'touch');
  if(touchMode && !localStorage.getItem('maze.tip')){
    localStorage.setItem('maze.tip', '1');
    toast('💡 펜 살짝 아래를 잡으면 손에 안 가려져요');
  }
  dragging = true;
  cv.setPointerCapture(e.pointerId);
  if(!running && !solved){ running = true; t0 = performance.now() - elapsed*1000; }
  e.preventDefault();
});

cv.addEventListener('pointermove', e => {
  if(!dragging || solved) return;
  // 한 프레임에 여러 좌표가 모이면 전부 순서대로 처리 → 빠르게 그어도 벽을 못 넘는다.
  // 빈 배열을 돌려주는 브라우저가 있어(합성 이벤트 등) 그때는 이벤트 자체를 쓴다.
  // 이 방어가 없으면 입력이 통째로 무시돼 펜이 아예 안 움직인다.
  let evts = e.getCoalescedEvents ? e.getCoalescedEvents() : null;
  if(!evts || !evts.length) evts = [e];
  for(const ev of evts){
    const p = toUnit(ev);
    moveTo(p.x + grabOff.x, p.y + grabOff.y);
  }
  e.preventDefault();
});

['pointerup','pointercancel'].forEach(t =>
  cv.addEventListener(t, () => { dragging = false; }));

/* ── 게임 흐름 ── */
function toast(msg){
  const el = $('toast');
  el.textContent = msg; el.classList.add('on');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove('on'), 1100);
}

function resetTrail(){
  const s = startCell();
  pen = {x:s.x, y:s.y};
  trail = [{x:s.x, y:s.y}];
  solved = false; dragging = false; hintPath = null;
  hits = 0; elapsed = 0; running = false;
  $('tHit').textContent = '0';
  $('tTime').textContent = '0.0';
  $('over').classList.remove('on');
}

/* 화면 비율에 맞춰 미로 모양을 정한다.
   정사각 미로를 세로로 긴 휴대폰에 넣으면 위아래가 남고 칸이 쓸데없이 작아진다.
   짧은 쪽을 난이도(base)로 고정하고 긴 쪽을 늘려 화면을 채운다 → 칸이 커져서
   손가락으로 긋기 쉬워지고, 칸 수가 늘어 난이도도 올라간다. */
/* 미로를 실제로 그릴 수 있는 영역(패딩 제외). pickDims 와 layout 이
   같은 값을 봐야 예측한 칸 크기와 실제 칸 크기가 어긋나지 않는다. */
function stageBox(){
  const st = $('stage'), cs = getComputedStyle(st);
  return {
    w: Math.max(0, st.clientWidth  - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight)),
    h: Math.max(0, st.clientHeight - parseFloat(cs.paddingTop)  - parseFloat(cs.paddingBottom)),
  };
}

function pickDims(base){
  const {w, h} = stageBox();
  if(!(w > 0 && h > 0)) return {cols: base, rows: base};

  const ar = w / h, MAX = 3.6;   // 이보다 길쭉해지면 미로가 복도처럼 단조로워진다
  // 손가락으로 긋는 화면에서는 칸이 일정 크기보다 작아지면 아예 못 논다.
  // (가로로 눕힌 휴대폰이 특히 그렇다 — 높이가 얼마 안 남는다.)
  // 그럴 때는 난이도를 한 단계씩 낮춰서라도 칸 크기를 확보한다.
  const MIN_CELL = matchMedia('(pointer: coarse)').matches ? 10 : 7;

  for(let b = base; ; b--){
    const cols = ar >= 1 ? Math.round(b * Math.min(ar, MAX)) : b;
    const rows = ar >= 1 ? b : Math.round(b / Math.max(ar, 1/MAX));
    // layout() 과 똑같이 내림해서 실제 칸 크기를 그대로 본다
    const cell = Math.floor(Math.min(w/(cols*2+1), h/(rows*2+1)));
    if(cell >= MIN_CELL || b <= 6) return {cols, rows};
  }
}

function newMaze(){
  seedCols = parseInt($('lv').value, 10);
  const {cols, rows} = pickDims(seedCols);
  maze = genBestMaze(cols, rows);
  resetTrail();
  layout();
  showBest();
}

// 모양이 다르면 걸리는 시간도 다르므로 기록도 모양별로 따로 남긴다
function bestKey(){ return `maze.best.${maze.cols}x${maze.rows}`; }
function showBest(){
  const b = localStorage.getItem(bestKey());
  $('tBest').textContent = b ? parseFloat(b).toFixed(1) : '-';
}

function win(){
  solved = true; dragging = false; running = false;
  const time = elapsed;
  const prev = parseFloat(localStorage.getItem(bestKey()) || 'Infinity');
  const isBest = time < prev;
  if(isBest) localStorage.setItem(bestKey(), String(time));
  showBest();

  $('ovTitle').textContent = isBest ? '🏆 신기록!' : '🎉 통과!';
  $('ovBody').innerHTML =
    `걸린 시간 <b>${time.toFixed(1)}초</b><br>벽에 막힌 횟수 <b>${hits}번</b>`;
  $('over').classList.add('on');
  chime();
}

function chime(){
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    const ac = new AC();
    [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = 'triangle'; o.frequency.value = f;
      const t = ac.currentTime + i*0.09;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.22, t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t+0.32);
      o.connect(g); g.connect(ac.destination);
      o.start(t); o.stop(t+0.34);
    });
    setTimeout(() => ac.close(), 900);
  }catch(_){}
}

$('btnNew').onclick    = newMaze;
$('btnRetry').onclick  = () => { resetTrail(); };
$('ovNew').onclick     = newMaze;
$('ovAgain').onclick   = () => { resetTrail(); };
$('lv').onchange       = newMaze;
$('btnHint').onclick   = () => {
  hintPath = hintPath ? null : solve();
  toast(hintPath ? '💡 정답 경로를 보여줄게요' : '정답 숨김');
};

window.addEventListener('resize', () => { if(maze) layout(); });
window.addEventListener('orientationchange', () => setTimeout(() => { if(maze) layout(); }, 200));
// 주소창이 접히고 펴질 때 화면 높이가 변한다 (모바일)
if(window.visualViewport) window.visualViewport.addEventListener('resize', () => { if(maze) layout(); });

/* ── 앱으로 쓰기 (PWA) ── */
const standalone = window.matchMedia('(display-mode: standalone)').matches
                || window.navigator.standalone === true;

// 오프라인 실행. file:// 로 열었을 때는 등록되지 않으니 조용히 넘어간다.
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load', () =>
    navigator.serviceWorker.register('./sw.js').catch(() => {}));
}

// 안드로이드·크롬: 설치 버튼을 띄운다
let installPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  installPrompt = e;
  $('btnInstall').hidden = false;
});
$('btnInstall').onclick = async () => {
  if(!installPrompt) return;
  installPrompt.prompt();
  await installPrompt.userChoice;
  installPrompt = null;
  $('btnInstall').hidden = true;
};
window.addEventListener('appinstalled', () => { $('btnInstall').hidden = true; });

// 아이폰 사파리에는 설치 API가 없다. 처음 한 번만 방법을 알려준다.
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
if(isIOS && !standalone && !localStorage.getItem('maze.ios')){
  localStorage.setItem('maze.ios', '1');
  setTimeout(() => toast('📲 공유 버튼 → "홈 화면에 추가" 하면 앱이 돼요'), 1200);
}

newMaze();
draw();
})();
</script>
</body>
